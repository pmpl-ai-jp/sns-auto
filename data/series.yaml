current:
  theme: PMとPLの違いを、AIと一緒に整理する5日間
  stage: career_exp
  goal: PMとPLの役割の違いを自分の言葉で説明できるようになり、転職や異動の前に確認すべきことと、議事録などの仕事でAIを安全に使い始める手順を持ち帰る。
  episodes:
  - title: 議事録をAIで整える手順
    point: 前回の予告に答え、議事録をAIで整える手順を結論から示す。手順は、社内ルールの確認、機密情報と個人情報を入れない、AIに整形させる、人が事実を確認する、の順。この作業を最初の題材にして、PMやPLの仕事の違いを考える入口にする。
  - title: PMとPLの違いは「何に責任を持つか」
    point: 結論として、PMは計画・品質・コスト・納期とお客様への責任、PLは現場の実行とチームの成果への責任と整理する。受注側でPMとPLを兼ねる立場から、経験に基づいて、同じ会議でも見ている点が違うことを示す。
  - title: PMの仕事：計画で問題を小さくする
    point: プロジェクト開始時に計画を綿密に立てると、問題が起きても立て直しが小さく済んだ経験を紹介する。PMの視点を、顧客・社内・ベンダーとの調整と、ロジカルに伝える方法から整理する。
  - title: PLの仕事：現場を動かし、自分で確認する
    point: PLの仕事を、チームへの指示、成果物の確認、トラブル時にソースコードやデータを自分で見る動きとして説明する。ここ10年ほどバッチ系の設計を多く担当した経験をもとに、現場の判断を示す。
  - title: PMとPLの兼務と、AIの分担チェック
    point: 兼務のときに起きやすい、判断の混在と負荷の偏りを整理する。AIに任せる作業を、目的・入力・完成条件・承認者で決める型を紹介し、最後に、転職前に確認することをまとめたチェックリストを示す。
