# 投稿テーマの配分。affiliate: true のテーマだけ、affiliates.yaml の同じキーの案件を付ける
# 方針（2026-11-02）: AI仕事術40% / キャリア30% / 伝え方20% / 運用ログ10% / PRは承認まで0%
stages:
  ai_work:
    name: "AI × 仕事術（PM/PLの視点：AIへの依頼の仕方、出力のレビュー、業務の自動化の考え方）"
    ratio: 0.40
    examples: ["AIへの頼み方は要件定義と同じ", "AIの出力をレビューする3つの観点", "取り出す・変える・置くに分けると自動化できる", "計画で結果が決まる"]
  career_exp:
    name: "キャリア（SIer・事業会社・外資SIer、PMとPLの仕事、転職前に確認すること）"
    ratio: 0.30
    examples: ["SIerと事業会社で仕事の中身はどう変わるか", "発注側のSEがベンダーとどう付き合うか", "PMとPLの役割の違い", "職務経歴書でベンダーコントロールをどう書くか"]
  logic:
    name: "ロジカルシンキング・伝え方（結論から話す、報告・依頼・調整。AIで整える話も含む）"
    ratio: 0.20
    examples: ["結論→理由→具体例の順で話すと調整が早く進む", "上司への報告をAIでピラミッド構造に整える", "ベンダーへの依頼は事実と要望を分けて書く"]
  log:
    name: "AIエージェントでのSNS自動化の運用ログ（noteへの導線）"
    ratio: 0.10
    examples: ["今週の自動投稿の数字と失敗", "チェックで止まった投稿と直したこと"]
  career_exp_pr:
    name: "経験者向け転職エージェントの使い方（PR）"
    ratio: 0.0
    affiliate: true
    examples: ["エージェントに経歴を伝えるときのコツ"]
  learn_it_pr:
    name: "ITスクールの無料カウンセリング活用（PR）"
    ratio: 0.0
    affiliate: true
    examples: ["カウンセリング前に決めておくこと"]
