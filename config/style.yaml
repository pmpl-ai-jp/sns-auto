# 筆者の文体メモ。筆者が書いた文章から抜き出した、言い回し・文の長さ・語尾のくせ。
# 書く役は、ここに書かれた特徴に寄せて書く（中身はまねしない）。空欄なら使わない。
notes:
  - "「です・ます」を基本に、明るく前向きな口調で書く。ていねいだが、距離は近い"
  - "感嘆符「！」は、1投稿に1〜2回まで。多用しない"
  - "絵文字は、使うときも1投稿に1つまで。前向きなもの（💪など）だけ。毎回は付けない"
  - "冒頭は、読者の状況や困りごとから入ってよい。毎回「PMとして〜という場面があります」で始めない"
  - "決意や本音の一言（「頑張ります」「楽しみです」など）を、10本に2〜3本の割合で入れる。その投稿の内容に関する気持ちだけにする。今日あったこと・今日の予定は書かない（作り話になるため）"
  - "自分の立場から語る（「〜する者として」「現場でPMをしている立場から」など）。肩書きは「PM」のまま"
  - "問いかけを入れるときは、文の途中に置く。最後は言い切りの一文にする"
  - "短い文を多めにする。1文を長くしない"
# 筆者がよく使う言い回し（そのまま使ってよい）
phrases:
  - "〜する者として"
  - "頑張ります"
# 筆者が使わない言い回し
avoid: []
