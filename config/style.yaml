# 筆者の文体メモ。筆者が書いた文章から抜き出した、言い回し・文の長さ・語尾のくせ。
# 書く役は、ここに書かれた特徴に寄せて書く（中身はまねしない）。空欄なら使わない。
notes:
  - "「です・ます」を基本に、明るく前向きな口調で書く。ていねいだが、距離は近い"
  - "感嘆符「！」は、1投稿に1〜2回まで。多用しない"
  - "絵文字は、使うときも1投稿に1つまで。前向きなもの（💪など）だけ。毎回は付けない"
  - "冒頭は、読者の状況や困りごと、または結論から入る。冒頭に、筆者の立場や肩書きを書かない"
  - "決意や本音の一言（「頑張ります」「楽しみです」など）は、入れるよう指示された投稿にだけ入れる。その投稿の内容に関する気持ちだけにする。今日あったこと・今日の予定は書かない（作り話になるため）"
  - "筆者の立場や肩書き（「PMとして」「〜する者として」など）は、投稿に書かない。経験の話で必要な場面の時期だけは触れてよい"
  - "問いかけを入れるときは、文の途中に置く。最後は言い切りの一文にする"
  - "短い文を多めにする。1文を長くしない"
  # Threadsで反応のあった投稿の型から（2026-11-11追加。締めは言い切りのまま）
  - "1文を短く切り、文の切れ目で改行してリズムを作る"
  - "冒頭の1行で、結論か情景を置く。前置きは書かない"
  - "対比で見せるときは、短い文を並べて落差を作る"
  # 他アカウントの人気投稿の型から（2026-11-12追加。言い回しは写さない）
  - "冒頭は、前置きなしの言い切りか宣言の一文にしてよい"
  - "読んだ人が持ち帰れる実物（そのまま使える指示文やチェック項目）がある投稿は、それを付ける"
  - "話し言葉に近づけてよい。ただし砕けすぎない"
  - "効果や結果（「減りました」「進みました」「減りやすくなります」など）は、経歴や事実の表にあるときだけ書く。ないときは、やり方だけを書く"
  - "筆者の経験として語るとき（「私は〜した」「見てきた」）は、一覧にある文のまま使う。そのとき気づいたことや、結果、感想の細部は足さない。場面の描写（あるある）は、一覧になくても書いてよい"
  - "1投稿で言うことは1つにする。80〜160字を目安に、短く終える"
# 筆者がよく使う言い回し（そのまま使ってよい）
phrases:
  - "頑張ります"
# 筆者が使わない言い回し
avoid: []
