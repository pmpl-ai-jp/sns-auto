# 筆者の文体メモ。筆者が書いた文章から抜き出した、言い回し・文の長さ・語尾のくせ。
# 書く役は、ここに書かれた特徴に寄せて書く（中身はまねしない）。空欄なら使わない。
notes:
  - "短い文は常体（言い切り）で書く。「です・ます」にするのは、手順の導入（「こんなときは、〜します」）と、最後の問いかけだけ。説明口調の敬語（「書かれていません」「分かりません」「できません」「〜ではありません」）は使わず、「書いてない」「分からない」「できない」のように話し言葉で言う"
  - "感嘆符「！」は、1投稿に1〜2回まで。多用しない"
  - "絵文字は、使うときも1投稿に1つまで。前向きなもの（💪など）だけ。毎回は付けない"
  - "冒頭は、読者の状況や困りごと、または結論から入る。冒頭に、筆者の立場や肩書きを書かない"
  - "決意や本音の一言（「頑張ります」「楽しみです」など）は、入れるよう指示された投稿にだけ入れる。その投稿の内容に関する気持ちだけにする。今日あったこと・今日の予定は書かない（作り話になるため）"
  - "筆者の立場、肩書き、経歴、時期（「PMとして」「〜する者として」「事業会社のSE時代」など）は、投稿に書かない"
  - "Threadsの投稿は、最後の一文を、読者が返信しやすい問いかけ（「？」で終わる短い質問）にする。呼びかけは「あなた」にそろえる"
  - "短い文を多めにする。1文を長くしない"
  # Threadsで反応のあった投稿の型から（2026-11-11追加）
  - "1文を短く切り、文の切れ目で改行してリズムを作る"
  - "冒頭の1行で、結論か情景を置く。前置きは書かない"
  - "対比で見せるときは、短い文を並べて落差を作る"
  # 他アカウントの人気投稿の型から（2026-11-12追加。言い回しは写さない）
  - "冒頭は、前置きなしの言い切りか宣言の一文にしてよい"
  - "読んだ人が持ち帰れる実物（そのまま使える指示文やチェック項目）がある投稿は、それを付ける"
  - "話し言葉に近づけてよい。ただし砕けすぎない"
  - "効果や結果（「減りました」「進みました」「減りやすくなります」など）は、経歴や事実の表にあるときだけ書く。ないときは、やり方だけを書く"
  - "筆者の経験（「私は〜してきました」「見てきました」のような経験アピール）は書かない。場面の描写（あるある）だけで書く"
  - "1投稿で言うことは1つにする。80〜160字を目安に、短く終える"
  - "読者は、AIを使い始めた人。場面は、仕事ではなく日常（家、友だち、買い物、旅行、町内会など）から選ぶ"
  - "専門用語は使わない。使うときは、一般的な言葉に言い換えるか、一言で説明する（例:「切り戻し」は「元に戻す判断」）"
  # 2026-11-18追加：日常に寄せる文体ルール（Threadsの文章を手直ししながら決めた）
  - "場面は日常から入る（例: 修理の人に「原因はこれです」と言い切られる、友だちへのLINEが「見といて」だけ、結婚式のスピーチ、旅行の計画、町内会のメモ）。仕事の場面（会議、部下、取引先、ベンダー、議事録、評価、計画書など）は使わない"
  - "仕事っぽい言葉は、日常の言葉に言い換える（例: ベンダー→修理の人、議事録→町内会のメモ、共有→お知らせ、依頼→お願い、担当者→やる人、納期→期限）"
  - "手順に入る前は「こんなときは、〜します」で受ける。「だから私は」では受けない"
  - "AIの話は、1〜2行目の「AIの答えも同じ」「AIへのお願いも同じ」のような一文でつなぐ。ただし、AIなしで成立する投稿は、つながなくてよい"
  - "予防線（「私の見方では」「個人的には」「私は考えています」）は書かない"
  - "箇条書きのあとに「〜ためです」と理由を後付けで説明しない。理由が要るときは、本文の短い文にする"
  - "最後に「要点は〜です」のまとめ直しを書かない。最後は問いかけで終える"
  - "「〜したいです」「〜と考えています」のような願望・意思で終わらせず、「〜する」「〜します」と言い切る"
# 筆者がよく使う言い回し（そのまま使ってよい）
phrases:
  - "頑張ります"
# 筆者が使わない言い回し
avoid: []
