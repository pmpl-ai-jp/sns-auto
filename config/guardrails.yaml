# 投稿に含まれたら自動で書き直させる表現
ng_words:
  - 必ず
  - 絶対
  - 保証
  - 誰でも
  - 放置で
  - 確実に
  - No.1
  - 最強
  - 稼げる
  - 月収
  - 実質無料
  - 全額返金
# 金額・率の表現（facts.yaml 以外の数字を検知したら要確認にする）
number_pattern: "[0-9０-９]+ *(万円|円|%|％|割)"
pr_label: "【PR】"
pr_footer: "※本投稿はアフィリエイト広告（PR）を含みます"
max_rewrite: 2
# 一人称の体験談らしい表現。profile.yaml の episodes に根拠がなければ要確認に回す
experience_patterns:
  - "(私|僕|自分|俺)(が|は|も)?.{0,15}(だった|していた|働いていた)"
  - "(のとき|の頃|時代)[、「は]"
  - "(事務職|販売職|営業職|未経験)(だった|の頃|のとき|時代)"
  - "未経験から.{0,10}(した|できた)"
  - "(転職|入社|受講|卒業)(した|して|できた)"
  - "年収が"
  - "今はこうしてる"
