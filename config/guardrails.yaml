# 投稿に含まれたら自動で書き直させる表現
ng_words:
  - 必ず
  - 絶対
  - 保証
  - 誰でも
  - 放置で
  - 確実に
  - No.1
  - 最強
  - 稼げる
  - 月収
  - 実質無料
  - 全額返金
# 金額・率の表現（facts.yaml 以外の数字を検知したら要確認にする）
number_pattern: "[0-9０-９]+ *(万円|円|%|％|割)"
pr_label: "【PR】"
pr_footer: "※本投稿はアフィリエイト広告（PR）を含みます"
max_rewrite: 2
# 一人称の体験談らしい表現。profile.yaml の episodes に根拠がなければ要確認に回す
experience_patterns:
  - "(私|僕|自分|俺)(が|は|も)?.{0,15}(だった|していた|働いていた)"
  - "(のとき|の頃|時代)[、「は]"
  - "(事務職|販売職|営業職|未経験)(だった|の頃|のとき|時代)"
  - "未経験から.{0,10}(した|できた)"
  - "(転職|入社|受講|卒業)(した|して|できた)"
  - "(私|僕|自分)の?年収が(上が|下が|増え|減っ|変わっ)"
  - "今はこうしてる"

# NGワードを含んでいても、次の言い回しなら誇張ではないので止めない（注意書き・限定の表現）
allowed_phrases:
  - 保証しません
  - 保証できません
  - 保証はできません
  - 保証するものではありません
  - 保証されるわけではありません
  - 保証はありません
  - 保証はされません
  - 必ずしも
  - 絶対ではありません
  - 絶対とは言えません
  - 確実とは言えません
  - 確実ではありません
  - 誰でもできるわけではありません
  - 誰でもとは限りません
  - 稼げるとは限りません
  - 稼げる保証はありません
  - 年収が保証
  - 年収が上がるとは限りません
  - 年収が変わる
# 約束・断定の形（これらは常に止める）
promise_patterns:
  - "(必ず|絶対|確実に)(.{0,8})(稼|増|上が|成功|転職でき|受か|解決|成果)"
  - "(誰でも|だれでも)(.{0,6})(稼|できる|成功|転職)"
  - "(保証|約束)します"
  - "月収.{0,6}[0-9０-９]"

# AIっぽい決まり文句。見つかったら1回だけ書き直させる（公開は止めない）
ai_phrases:
  - あるあるですよね
  - コツは3つです
  - コツは2つです
  - 補足です
  - 補足を3つ
  - まず、私の経験です
  - ここからは、私の考えです
  - いかがでしたか
  - 結論から言うと
  - 〜と言えるでしょう
  - と言えるでしょう
  - ではないでしょうか
  - 大切なのは
  - ポイントは
  - 重要です
  - 意識しましょう
  - してみてください
  - 参考になれば幸いです
# 「〜と思います」「〜と考えます」は、1投稿に2回まで
hedge_words: ["と思います", "と考えます", "と考えています", "と感じています"]
hedge_max: 2
